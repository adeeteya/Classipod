name: Build and Deploy Releases

on:
  workflow_dispatch:
    inputs:
      android:
        description: 'Build Android Release'
        type: boolean
        default: true
      linux:
        description: 'Build Linux Release'
        type: boolean
        default: true
      windows:
        description: 'Build Windows Release'
        type: boolean
        default: true
      ios:
        description: 'Build unsigned iOS IPA'
        type: boolean
        default: true
      macos:
        description: 'Build macOS DMG'
        type: boolean
        default: true
      web:
        description: 'Build Web Release'
        type: boolean
        default: true

env:
  FLUTTER_CHANNEL: "stable"
  RUBY_VERSION: "3.4"

jobs:

  create_github_release:
    name: Create GitHub Release
    outputs:
      version_number: ${{ steps.version.outputs.version_number }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read release version from pubspec.yaml
        id: version
        run: |
          ruby -ryaml <<'RUBY'
          version = YAML.load_file('pubspec.yaml').fetch('version').to_s
          match = /\A(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)(?:\+\d+)?\z/.match(version)
          abort "Invalid pubspec.yaml version: #{version.inspect}" unless match
          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') do |file|
            file.puts("version_number=#{match[1]}")
          end
          puts "Release version: #{match[1]} (pubspec: #{version})"
          RUBY

      - name: Create a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.version_number }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release '$RELEASE_TAG' already exists. Skipping release creation."
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
              --title "Version $RELEASE_TAG" --generate-notes
          fi

  build_web:
    needs: create_github_release
    if: ${{ inputs.web }}
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Flutter tasks
        uses: subosito/flutter-action@v2
        with:
            flutter-version-file: 'pubspec.yaml'
            channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Generate Localizations
        run: flutter gen-l10n

      - uses: bluefireteam/flutter-gh-pages@v9
        with:
          baseHref: /Classipod/
          # universal_html still depends on dart:html; use JavaScript.
          compileToWasm: false

  build_linux:
    needs: create_github_release
    if: ${{ inputs.linux }}
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Flutter tasks
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version-file: 'pubspec.yaml'
          channel: ${{ env.FLUTTER_CHANNEL }}
          architecture: x64
          cache: true
      
      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libasound2-dev libcurl4-openssl-dev libsecret-1-dev
      
      - name: Verify secure storage build dependency
        run: pkg-config --print-errors --atleast-version=0.18.4 libsecret-1

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Generate Localizations
        run: flutter gen-l10n
      
      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Install Build Dependencies
        run: |
          sudo apt-get -y install libfuse-dev locate
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool
          sudo apt-get -y install dpkg
          sudo apt-get -y install patchelf rpm
      
      - name: Build and release
        run: |
          mkdir -p "$RUNNER_TEMP/fastforge-bin"
          cat > "$RUNNER_TEMP/fastforge-bin/cp" <<'SH'
          #!/usr/bin/env bash
          exec flock "$RUNNER_TEMP/classipod-appimage-copy.lock" /usr/bin/cp "$@"
          SH
          chmod +x "$RUNNER_TEMP/fastforge-bin/cp"
          PATH="$RUNNER_TEMP/fastforge-bin:$PATH" fastforge release --name production
      
      - name: "Publish Linux Release"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          REL_VER=$(grep "^version" pubspec.yaml | cut -d' ' -f2)
          for PKG in AppImage deb rpm; do
            mv "dist/${REL_VER}/classipod-${REL_VER}-linux.${PKG}" "Classipod-Linux-${PKG}.${PKG}"
            gh release upload ${{ needs.create_github_release.outputs.version_number }} "Classipod-Linux-${PKG}.${PKG}" --clobber
          done

  build_windows:
    needs: create_github_release
    if: ${{ inputs.windows }}
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install yq
        run: choco install yq

      - name: Run Flutter tasks
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: 'pubspec.yaml'
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Generate Localizations
        run: flutter gen-l10n

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Install Inno Setup from GitHub
        shell: pwsh
        env:
          INNO_SETUP_VERSION: '6.7.3'
          INNO_SETUP_SHA256: '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
        run: |
          $version = $env:INNO_SETUP_VERSION
          $tag = 'is-' + $version.Replace('.', '_')
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-$version.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "inno-setup-$version"
          $url = "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$version.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $env:INNO_SETUP_SHA256) {
            throw 'Inno Setup installer checksum mismatch.'
          }
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$installDir`"")
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }
          $compilerPath = Join-Path $installDir 'ISCC.exe'
          if (-not (Test-Path $compilerPath)) {
            throw 'Inno Setup compiler not found after installation.'
          }
          "INNO_SETUP_COMPILER=$compilerPath" >> $env:GITHUB_ENV

      - name: Run Inno Setup to Build Installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.create_github_release.outputs.version_number }}
        run: |
          & $env:INNO_SETUP_COMPILER "/DMyAppVersion=$env:RELEASE_VERSION" scripts\windows-setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows Release Artifact to GitHub Release
        shell: cmd
        run: |
          gh release upload ${{ needs.create_github_release.outputs.version_number }} "%GITHUB_WORKSPACE%\Classipod-Windows.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  build_android:
    needs: create_github_release
    if: ${{ inputs.android }}
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: classipod-google-play-release
      cancel-in-progress: false
    env:
      APP_PACKAGE_NAME: ${{ secrets.APP_PACKAGE_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: 'android'

      - name: Run Flutter tasks
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version-file: 'pubspec.yaml'
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Create google_service_account.json
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}" | base64 --decode > google_service_account.json

      - name: Create key.jks
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_FILE_BASE64 }}" | base64 --decode > android/key.jks

      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyAlias=release
          storeFile=../key.jks
          EOF
        env:
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}

      - name: Select next Google Play build number
        working-directory: android
        run: bundle exec fastlane prepare_build_number

      - name: Build APK
        uses: maierj/fastlane-action@v3.1.0
        with:
          lane: 'build_apk'
          subdirectory: android
          options: '{ "version_number": "${{ needs.create_github_release.outputs.version_number }}" }'
      
      - name: Upload APK Artifact to GitHub Release
        run:  gh release upload ${{ needs.create_github_release.outputs.version_number }} build/app/outputs/flutter-apk/Classipod-Android.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Release To Play Store
        uses: maierj/fastlane-action@v3.1.0
        with:
          lane: 'release_play_store'
          subdirectory: android
          options: '{ "version_number": "${{ needs.create_github_release.outputs.version_number }}" }'
        env:
          APP_PACKAGE_NAME: ${{ secrets.APP_PACKAGE_NAME }}

  build_ios:
    if: ${{ inputs.ios }}
    needs: create_github_release
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ios

      - name: Build and package without Apple credentials
        working-directory: ios
        run: bundle exec fastlane build_apple_release platform:ios

      - name: Save release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: classipod-ios
          path: |
            build/releases/Classipod-iOS.ipa
            build/releases/Classipod-iOS.ipa.sha256
          if-no-files-found: error

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.create_github_release.outputs.version_number }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "build/releases/Classipod-iOS.ipa" \
            "build/releases/Classipod-iOS.ipa.sha256" --clobber

  build_macos:
    if: ${{ inputs.macos }}
    needs: create_github_release
    name: Build macOS DMG (not notarized)
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ios

      - name: Build and package without Apple credentials
        working-directory: ios
        run: bundle exec fastlane build_apple_release platform:macos

      - name: Save release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: classipod-macos
          path: |
            build/releases/Classipod-macOS.dmg
            build/releases/Classipod-macOS.dmg.sha256
          if-no-files-found: error

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.create_github_release.outputs.version_number }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "build/releases/Classipod-macOS.dmg" \
            "build/releases/Classipod-macOS.dmg.sha256" --clobber

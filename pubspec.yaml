name: classipod
description: "A ipod Classic Emulator"

publish_to: 'none'

version: 1.12.0+25

environment:
  sdk: ^3.13.2
  flutter: 3.47.5

dependencies:
  audio_service: ^0.18.19
  battery_plus: ^7.1.1
  crypto: ^3.0.7
  cupertino_icons: ^1.0.9
  cupertino_ui: ^1.1.1
  device_preview_plus: ^2.9.4
  disable_battery_optimization:
    git:
      url: https://github.com/adeeteya/Disable-Battery-Optimizations.git
      ref: master
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_taglib:
    git:
      url: https://github.com/adeeteya/flutter_taglib.git
      ref: 588e4d8e35a39d46ee29f01e4d42dc23dde93bc3
  go_router: ^18.0.1
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  intl: any
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  on_audio_query:
    git:
      url: https://github.com/adeeteya/on_audio_query.git
      ref: aramesh/android-library-indexing
      path: packages/on_audio_query
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.5
  tutorial_coach_mark: ^1.3.4
  universal_html: ^2.3.0
  url_launcher: ^6.3.2
  vibration: ^3.2.1
  vibration_web: ^1.6.8
  volume_controller: ^3.7.1

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  hive_ce_generator: ^1.11.3
  riverpod_lint: ^3.1.9
  shared_preferences_platform_interface: ^2.4.2

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/images/

  fonts:
    - family: Helvetica
      fonts:
        - asset: assets/fonts/Helvetica.ttf
        - asset: assets/fonts/Helvetica-Bold.ttf
          weight: 700

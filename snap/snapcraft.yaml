name: classipod
version: 2.1.0
summary: iPod Classic-inspired player for local music and Subsonic/Navidrome streaming
description: |
  ClassiPod brings an iPod Classic-inspired interface to local music and your
  own Subsonic-compatible server, including Navidrome. Browse both collections
  together or hide local tracks while your server is enabled.

  Explore songs, artists, albums and genres with a click wheel or touch controls.
  Create ClassiPod playlists, view embedded lyrics, rate songs, shuffle songs or
  whole albums, repeat tracks, and set a sleep timer. Restore your previous queue
  and selected song after reopening, paused at the beginning.

  Choose light/dark themes, device colors including OLED Black, and Original or
  Big Cover Flow layouts. Enjoy artwork reflections, split-screen previews,
  fullscreen Immersive Mode, bundled click sounds and Linux MPRIS media controls.
  Cache metadata/artwork, refresh or reindex, exclude folders, inspect missing
  tracks, and optionally hide duplicate filenames.

  Local files work offline. Streaming requires your own compatible server,
  account and network connection. Server audio is not cached for offline use;
  server playlists are not synchronized. Ratings and edits stay in ClassiPod.
icon: snap/gui/classipod.png
contact: mailto:adeeteya@gmail.com
source-code: https://github.com/adeeteya/Classipod
issues: https://github.com/adeeteya/Classipod/issues
license: BSD-4-Clause

confinement: strict
base: core22
grade: stable

slots:
  mpris:
    interface: mpris
    name: classipod
  dbus-classipod:
    interface: dbus
    bus: session
    name: com.adeeteya.classipod

apps:
  classipod:
    command: classipod
    extensions: [gnome]
    plugs:
      - audio-playback
      - removable-media
      - desktop
      - desktop-legacy
      - home
    slots:
      - mpris
      - dbus-classipod
parts:
  classipod:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart
    build-packages:
      - clang
      - cmake
      - git
      - libgtk-3-dev
      - liblzma-dev
      - ninja-build
      - pkg-config
    stage-packages:
      - mpv
      - libmpv1
      - libgtk-3-0
      - libglib2.0-0
      - libgdk-pixbuf-2.0-0
      - libpango-1.0-0
      - libpangocairo-1.0-0
      - libatk1.0-0
      - libatk-bridge2.0-0
      - libx11-6
      - libxkbcommon0
      - libwayland-client0
      - libegl1
      - libstdc++6
      - libsqlite3-0
      - liblzma5
      - libcurl4
      - libasound2
      - xdg-utils
      - ca-certificates
    override-pull: |
      snapcraftctl pull
      if [ ! -d flutter-sdk ]; then
        git clone https://github.com/flutter/flutter.git -b 3.47.6 flutter-sdk
      fi
    override-build: |
      export PATH=$PWD/flutter-sdk/bin:$PATH
      flutter pub get
      flutter gen-l10n
      flutter build linux --release --target lib/main.dart
      install -D build/linux/x64/release/bundle/classipod $CRAFT_PART_INSTALL/classipod
      cp -r build/linux/x64/release/bundle/* $CRAFT_PART_INSTALL/
